# Unity CI — compiles com.sqlitehost.runtime inside real Unity editors and
# runs the package's EditMode tests there: at the version its package.json
# claims as the floor, and on every newer editor line a free personal
# licence can actually activate.
#
# ══════════════════════════════════════════════════════════════════════════
# ONE-TIME OWNER SETUP — this workflow's test job FAILS on purpose until it
# is done. Unity cannot run in batch mode without an activated licence, and
# a licence cannot be committed.
#
#   1. Install Unity Hub locally and sign in with the Unity ID that should
#      own the CI activations.
#   2. Unity Hub > Preferences (Settings) > Licenses > Add > "Get a free
#      personal license".
#   3. Read the generated licence file:
#        macOS   /Library/Application Support/Unity/Unity_lic.ulf
#        Linux   ~/.local/share/unity3d/Unity/Unity_lic.ulf
#        Windows C:\ProgramData\Unity\Unity_lic.ulf
#   4. Repo > Settings > Secrets and variables > Actions > New repository
#      secret, three times:
#        UNITY_LICENSE   the ENTIRE contents of Unity_lic.ulf, XML
#                        declaration included
#        UNITY_EMAIL     the Unity ID email
#        UNITY_PASSWORD  the Unity ID password
#      UNITY_LICENSE is the one this workflow actually activates with:
#      game-ci's activate.sh has two branches, and with UNITY_LICENSE set
#      and no UNITY_SERIAL it takes the PERSONAL branch, which runs
#      `unity-editor -manualLicenseFile` and never reads the account
#      credentials. UNITY_EMAIL/UNITY_PASSWORD are required by the guard
#      below anyway: they are what a switch to the serial branch would
#      need, and a half-configured secret set fails later and less
#      clearly.
#
# Constraints that shaped this file, so nobody "simplifies" them back out:
#
#   * Which editor patches CI can run is decided by Unity's public release
#     feed, NOT by what unityci/editor has an image for. Docker Hub
#     publishes images for Extended-LTS editors (e.g.
#     ubuntu-2022.3.76f1-linux-il2cpp-3) that a personal licence cannot
#     activate: the image pulls, the job burns five minutes, activation
#     fails. Every version below was checked against
#       https://services.api.unity.com/unity/editor/release/v1/releases?version=<exact>
#     which returns total=0 for a withheld (Industry/Enterprise-only)
#     patch. Never pick a version by browsing Docker Hub tags.
#   * Lines this workflow deliberately does NOT test, so the gap is
#     visible rather than forgotten:
#       - 2021.3 above .45f2 (including the 2021.3.55f1 that
#         unity/SampleProject pins) — Extended LTS, Industry/Enterprise
#         licence only.
#       - 2022.3 above .62f3 (.63f1 onward, up to the 2022.3.76f1 image
#         that exists on Docker Hub) — Extended LTS, same lockout.
#       - 2020.3 / 2019.4 — still publicly activatable, but below the
#         package's declared floor, so testing there proves nothing the
#         package promises.
#       - arm64 runners — a GameCI limit, not a Unity one: every
#         unityci/editor image index advertises amd64 only. Every leg
#         stays on the x64 ubuntu-latest runner.
#   * The floor leg is the one that can actually break: package.json
#     declares "unity": "2021.3", and a newer editor proves nothing about
#     it. The newer legs prove the opposite direction — that the
#     Unity-2021-safe subset still compiles and passes on the editors
#     consumers are actually on.
#   * Unity 6.0 LTS support ends October 2026. When it lapses, 6000.0 gets
#     an Extended-LTS continuation and its public feed freezes at some
#     patch, exactly as 2021.3 froze at .45f2 and 2022.3 at .62f3. From
#     that point the 6000.0 pin must stop advancing.
#   * No caching anywhere in this workflow: a Unity Library/ cache keyed
#     across eight editor versions is a well-known source of phantom
#     failures. Every leg re-imports from scratch, which is what keeps the
#     legs independent. The per-leg cost is dominated by the image pull
#     anyway, which a Library cache does not touch.
#   * GitHub never passes repository secrets to a run triggered by a pull
#     request from a fork, so the licenced job cannot work there. It is
#     skipped for fork pull requests instead of failing them: an outside
#     contributor gets the licence-free scaffold-guard and a green check,
#     and the editor runs once a maintainer pushes the branch here.
#   * The editor image is pinned by digest (customImage), not left to the
#     action's tag lookup: the action's own SHA pin says nothing about the
#     container it pulls, and that container receives the licence secrets.
#
# The FLOOR matrix entry below and
# unity/ci-project/ProjectSettings/ProjectVersion.txt are two literals that
# must agree; the scaffold-guard job fails loudly if they drift. The other
# legs are allowed to be higher — the action is given an explicit
# unityVersion, so it never reads ProjectVersion.txt, and Unity's in-place
# upgrade happens on the runner's ephemeral checkout only.
# ══════════════════════════════════════════════════════════════════════════

name: unity-ci

on:
  push:
    branches: [main]
    paths:
      - 'unity/**'
      - 'csharp/SqliteHost.Abstractions/**'
      - 'csharp/SqliteHost.Runtime/**'
      - 'csharp/SqliteHost.Generated.Sample/**'
      - '.github/workflows/unity-ci.yml'
  pull_request:
    paths:
      - 'unity/**'
      - 'csharp/SqliteHost.Abstractions/**'
      - 'csharp/SqliteHost.Runtime/**'
      - 'csharp/SqliteHost.Generated.Sample/**'
      - '.github/workflows/unity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-guard:
    name: CI project matches the package floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs without a Unity licence, so the scaffolding stays verified even
      # before the secrets exist. Catches the drift that would otherwise
      # surface as a confusing editor error twenty minutes into a run. Its
      # own clean checkout, so it always sees the COMMITTED project — never
      # a copy some newer editor leg upgraded in place.
      - name: Check the CI project against the package manifest
        env:
          # The floor leg of the matrix below, not the whole matrix: the
          # committed project is pinned at the floor and the newer legs
          # open that same project with a newer editor.
          FLOOR_UNITY_VERSION: 2021.3.45f2
          FLOOR_TEST_FRAMEWORK: 1.1.33
        run: |
          python3 - <<'PY'
          import json, os, sys

          expected = os.environ["FLOOR_UNITY_VERSION"]
          expected_tf = os.environ["FLOOR_TEST_FRAMEWORK"]
          problems = []

          package = json.load(open("unity/com.sqlitehost.runtime/package.json"))
          floor = package.get("unity")
          if not floor:
              problems.append('package.json has no "unity" field to test against')

          version_line = open(
              "unity/ci-project/ProjectSettings/ProjectVersion.txt"
          ).readline().strip()
          prefix = "m_EditorVersion:"
          if not version_line.startswith(prefix):
              problems.append("ProjectVersion.txt does not start with " + prefix)
              project_version = ""
          else:
              project_version = version_line[len(prefix):].strip()

          if floor and not project_version.startswith(floor + "."):
              problems.append(
                  "the CI project pins Unity " + project_version
                  + ' but the package declares floor "' + floor
                  + '" — the CI project must be committed at the floor, not a newer line'
              )
          if project_version != expected:
              problems.append(
                  "the workflow's floor matrix leg pins " + expected
                  + " but ProjectVersion.txt pins " + project_version
                  + " — keep the two literals in step"
              )

          manifest = json.load(open("unity/ci-project/Packages/manifest.json"))
          reference = manifest.get("dependencies", {}).get("com.sqlitehost.runtime")
          if reference != "file:../../com.sqlitehost.runtime":
              problems.append(
                  "the CI project must consume the package from the worktree via "
                  '"file:../../com.sqlitehost.runtime", found: ' + repr(reference)
              )
          test_framework = manifest.get("dependencies", {}).get("com.unity.test-framework")
          if not test_framework:
              problems.append("the CI project needs com.unity.test-framework to run EditMode tests")
          elif test_framework != expected_tf:
              problems.append(
                  "the committed manifest pins com.unity.test-framework "
                  + test_framework + " but the workflow's floor leg expects "
                  + expected_tf
                  + " — the committed pin is the floor's, and each newer leg"
                  " overwrites it on the runner"
              )

          asmdef_path = (
              "unity/ci-project/Assets/Tests/EditMode/"
              "SqliteHost.CiProject.EditModeTests.asmdef"
          )
          asmdef = json.load(open(asmdef_path))
          for required in ("SqliteHost", "UnityEngine.TestRunner", "UnityEditor.TestRunner"):
              if required not in asmdef.get("references", []):
                  problems.append(asmdef_path + " must reference " + required)

          if problems:
              for problem in problems:
                  print("::error title=Unity CI scaffold drift::" + problem)
              sys.exit(1)
          print("CI project pins Unity " + project_version + "; package floor is " + str(floor) + ".")
          PY

      # Says out loud why the run stops here, so a fork contributor does
      # not read the missing editor job as something they broke.
      - name: Explain the skipped editor job on fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice title=Unity EditMode tests skipped::Pull requests from a fork cannot read the repository's Unity licence secrets, so the editor job does not run here. A maintainer runs it on this branch before merging."

  edit-mode-tests:
    name: EditMode tests (Unity ${{ matrix.unity-version }})
    needs: scaffold-guard
    # Same-repo events only. A fork pull request gets empty secrets no
    # matter what, so running the job there can only produce a red check
    # that reads like the contributor's fault.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One editor at a time. Personal-licence activation here is
      # `-manualLicenseFile` with a randomized machine ID per container, so
      # parallel legs would probably work — but Unity documents no rate
      # limit for a path game-ci itself calls unsupported, and the failure
      # mode is a wholly red matrix that reads like a code regression.
      # Serial costs ~45 minutes of wall clock and buys that certainty.
      # Raise to 2-3 and watch if it ever hurts; do not remove it.
      max-parallel: 1
      # `include:` rather than a version list on purpose: the editor
      # version and the digest of the image that provides it must travel
      # together. A tag-only pin lets a mutable tag hand the licence
      # secrets to a container nobody reviewed.
      #
      # Re-resolve a digest with (the tag is exactly what game-ci would
      # resolve for that editor on a Linux runner):
      #   docker buildx imagetools inspect \
      #     unityci/editor:ubuntu-<version>-linux-il2cpp-3 \
      #     --format '{{.Manifest.Digest}}'
      # Cross-check against Docker Hub's own record with:
      #   curl -sH 'User-Agent: curl' \
      #     'https://hub.docker.com/v2/repositories/unityci/editor/tags?page_size=100&name=<version>'
      # and confirm the version is publicly activatable FIRST (see the
      # release-feed probe in the header) — Docker Hub only says whether an
      # image exists, not whether the licence can run it.
      #
      # com.unity.test-framework travels with the editor: the committed
      # manifest pins the floor's 1.1.33 (measured green on 2021.3.45f2)
      # and each newer leg overwrites it on the runner, so a resolution
      # failure names one leg instead of poisoning all of them. 1.4.6 is
      # the registry's latest and is unverified on these editors until the
      # first run of this matrix.
      matrix:
        include:
          # The package's declared floor, and the only leg that can prove
          # the "unity": "2021.3" claim. Newest 2021.3 patch a personal
          # licence can activate — .46f1 onward is Extended LTS.
          - unity-version: 2021.3.45f2
            editor-image: unityci/editor@sha256:903ced48a1d4f415b597280b76c4f01f1bd38f66c654805fb3ffd16874d7d2ee
            test-framework: 1.1.33
          # 2022.3 LTS. Newest patch a personal licence can activate —
          # .63f1 onward is Extended LTS, even though Docker Hub publishes
          # an image as far as 2022.3.76f1.
          - unity-version: 2022.3.62f3
            editor-image: unityci/editor@sha256:13aff281d283f6e7ce4a61d1444e057dfb0b9aa8667ac033fbd212d3eeed0b26
            test-framework: 1.4.6
          # Unity 6.0 LTS, supported through October 2026. Still actively
          # patched, so the newest patch is public; see the header note
          # about freezing this pin once support lapses.
          - unity-version: 6000.0.82f1
            editor-image: unityci/editor@sha256:a88298650cc7bfb1ef1b7ca63b6b82f434ac592c07c3e13f0b24e59f6231fd0b
            test-framework: 1.4.6
          # Unity 6.1 — a Supported Update release, not LTS, and out of
          # support (last patch 6000.1.17f1, October 2025). Fully
          # activatable: Supported Update lines get no Extended-LTS
          # lockout. Coverage for consumers still sitting on it.
          - unity-version: 6000.1.17f1
            editor-image: unityci/editor@sha256:5dcf7433f491c1cc2994389bfc1f6b51a6f70f07770ba83e9d457a0f5b435b6c
            test-framework: 1.4.6
          # Unity 6.2 — Supported Update release, explicitly no longer
          # supported by Unity (last patch December 2025). Activatable,
          # same reasoning as 6.1.
          - unity-version: 6000.2.15f1
            editor-image: unityci/editor@sha256:a3e0e7c61add8a284c096a9fbded6023d72da19a2bcb8592183f3b61c0e8dd51
            test-framework: 1.4.6
          # Unity 6.3 LTS, supported until December 2027 — the
          # longest-lived line available and the one most consumers will
          # land on. The most valuable leg after the floor.
          - unity-version: 6000.3.22f1
            editor-image: unityci/editor@sha256:bd9f0c77473bc842423236ec1498f180380f734dde521397e0fac2319865e87a
            test-framework: 1.4.6
          # Unity 6.4 — Supported Update release, already superseded by
          # 6.5. Activatable; kept for completeness of the 6000 lines.
          - unity-version: 6000.4.12f1
            editor-image: unityci/editor@sha256:9c87358957e7820ec9913d5403dae0b8f78fdd401d6201d6e2d735da655e129c
            test-framework: 1.4.6
          # Unity 6.5 — current Supported Update release. Forward
          # coverage: it is the early warning for whatever becomes the
          # next LTS.
          - unity-version: 6000.5.9f1
            editor-image: unityci/editor@sha256:e4199b3ebec810002ed106e8251f9e7d14d2468d4fdd503a6c4b7cc262c57445
            test-framework: 1.4.6
    steps:
      # First step on purpose: a missing secret should cost seconds, not a
      # cryptic activation failure after the editor image has been pulled.
      - name: Require the Unity licence secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -eu
          missing=""
          [ -n "${UNITY_LICENSE}" ] || missing="${missing} UNITY_LICENSE"
          [ -n "${UNITY_EMAIL}" ] || missing="${missing} UNITY_EMAIL"
          [ -n "${UNITY_PASSWORD}" ] || missing="${missing} UNITY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error title=Unity licence not configured::Missing repository secret(s):${missing}. Unity cannot run in batch mode without an activated licence. Create a free personal licence in Unity Hub (Preferences > Licenses > Add > Get a free personal license), then add the contents of Unity_lic.ulf as UNITY_LICENSE plus your Unity ID as UNITY_EMAIL and UNITY_PASSWORD under Settings > Secrets and variables > Actions. Full steps: the comment block at the top of .github/workflows/unity-ci.yml and docs/guides/publishing.md section i."
            exit 1
          fi
          echo "Unity licence secrets are present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Load-bearing, not tidiness: a stock runner has 14 GB free, and a
      # Unity 6 editor image is ~5.7 GB compressed / ~9-10 GB unpacked.
      # Removing the preinstalled SDKs we do not use takes it to ~35 GB.
      # Keep this on every leg — the margin shrinks as the images grow.
      - name: Free disk space for the editor image
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
          df -h /

      # The committed manifest carries the floor's test-framework version.
      # Newer editors want a newer one, and the CI project is scratch on
      # the runner, so each leg rewrites its own copy. Nothing here is
      # committed; the scaffold-guard reads the pristine file in its own
      # checkout.
      - name: Pin com.unity.test-framework for this editor
        env:
          TEST_FRAMEWORK_VERSION: ${{ matrix.test-framework }}
        run: |
          python3 - <<'PY'
          import json, os

          path = "unity/ci-project/Packages/manifest.json"
          manifest = json.load(open(path))
          manifest["dependencies"]["com.unity.test-framework"] = os.environ[
              "TEST_FRAMEWORK_VERSION"
          ]
          with open(path, "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print("com.unity.test-framework pinned to " + os.environ["TEST_FRAMEWORK_VERSION"])
          PY

      # What a consumer does through Package Manager > Samples > Import,
      # done in the shell. Its only purpose is to put the sample in front of
      # a real compiler: Samples~ is invisible to Unity inside a package, so
      # nothing else in this repo ever type-checks SmokeBehaviour.cs.
      - name: Import the package sample into the CI project
        run: |
          set -eu
          rm -rf unity/ci-project/Assets/Samples
          mkdir -p unity/ci-project/Assets/Samples
          cp -R 'unity/com.sqlitehost.runtime/Samples~/GeneratedSample' \
                unity/ci-project/Assets/Samples/GeneratedSample
          find unity/ci-project/Assets/Samples -type f | sort

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Explicit, never "auto": the action only parses
          # ProjectVersion.txt for the literal "auto", and this matrix
          # deliberately opens the floor-pinned project with newer editors.
          unityVersion: ${{ matrix.unity-version }}
          # Pinning the container the same way every action here is pinned.
          # Without it the action resolves a MUTABLE tag at run time, and
          # the Unity ID credentials above are handed to whatever that tag
          # points at today.
          customImage: ${{ matrix.editor-image }}
          projectPath: unity/ci-project
          testMode: EditMode
          artifactsPath: unity/ci-project/artifacts

      # The editor runs as root inside the container; without this the
      # upload step cannot read what it wrote.
      - name: Make the results readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" unity/ci-project/artifacts || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-editmode-results-${{ matrix.unity-version }}
          path: unity/ci-project/artifacts
          if-no-files-found: warn
          retention-days: 14
